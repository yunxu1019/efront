<div class="options">
    <btn ng-click=add()><i>+</i><SPAN>添加字段</SPAN></btn>
</div>
<dlist ng-src='(f,cx) in fields' class="fields">
    <padding>
        <div class="field-item">
            <i .index -bind="cx+1"></i>
            <field -src="[d,f]" -repeat="d in defines"></field>
            <drop ng-click="remove(f)"></drop>
        </div>
    </padding>
</dlist>
